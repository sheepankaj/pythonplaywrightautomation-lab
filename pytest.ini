[pytest]
testpaths = tests
addopts =
    -v
    --html=reports/report.html
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --video=retain-on-failure
    --alluredir=reports/allure-results
markers =
    login_and_product_page: Login and product page smoke tests
    negative_test: Negative/failure path tests
    incremental: Serial CRUD lifecycle tests (run in order)
